name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANSIWISE_TESTS_MAY_SKIP: '1'
      HOSTYOUR_DEPLOY_CHECKOUT_MAY_BE_ABSENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      # The delivered-values contract case reads hostyour-cloud's consumers ApplicationSet beside this
      # checkout and renders it with Go, as the ApplicationSet controller does; without both it fails.
      - name: Check out hostyour-cloud beside this repository
        run: git clone --depth 1 --branch master https://github.com/simetrixch/hostyour-cloud.git ../hostyour-cloud
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ../hostyour-cloud/scripts/appset-render/go.mod
          cache-dependency-path: ../hostyour-cloud/scripts/appset-render/go.sum
      - run: npm ci
      - name: Run test suites
        run: |
          echo 'NOT RUN: ansiwise real-serve suites need the ansiwise binary pair.'
          echo 'NOT RUN: the cluster-map contract case needs the hostyour-deploy checkout beside this one.'
          npx vitest run
